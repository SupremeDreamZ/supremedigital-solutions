<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070806">
<title>PowrHouse — Cultivate. Validate. Showcase.</title>
<style>
html,body{height:100%;margin:0;background:#070806;color:#e8dfcf;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;overflow:hidden}main{width:min(86vw,620px)}.logo{color:#f13b34;font:900 italic clamp(2.2rem,8vw,5rem)/.9 Impact,'Arial Narrow Bold',sans-serif;text-shadow:2px 2px #000}p{font:900 .72rem/1.4 monospace;letter-spacing:.13em;color:#aaa798}.track{height:8px;border:1px solid #393b32;background:#10120e}.bar{height:100%;width:0;background:#c8ff38;box-shadow:0 0 16px #c8ff38;transition:width .18s ease}pre{color:#ff665f;white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body><main><div class="logo">PowrHouse.</div><p id="status">ASSEMBLING ORIGINAL EXPERIENCE · 0%</p><div class="track"><div id="bar" class="bar"></div></div><pre id="error" hidden></pre></main>
<script>
(async()=>{
const files=['./payload/gz-00.b64','./payload/gz-01.b64','./payload/gz-02.b64'];
const compressedHash='78373ef7d05c6ea2a87f98794e317bc84633c9e552129dbc7e21cc7d15b8c2e8';
const htmlHash='aa1535fb06ad4658f6361118ec67db696c1279c82dd45d6eda2d9281e6f2389c';
const status=document.getElementById('status'),bar=document.getElementById('bar'),error=document.getElementById('error');
const hex=b=>[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
try{
 if(typeof DecompressionStream==='undefined')throw new Error('This browser needs gzip stream support. Use a current Safari, Chrome, Edge or Firefox release.');
 let encoded='';
 for(let i=0;i<files.length;i++){
  const r=await fetch(files[i],{cache:'no-store'});
  if(!r.ok)throw new Error(`Site payload ${i+1} failed: HTTP ${r.status}`);
  encoded+=(await r.text()).trim();
  const p=Math.round(((i+1)/files.length)*72);status.textContent=`ASSEMBLING ORIGINAL EXPERIENCE · ${p}%`;bar.style.width=`${p}%`;
 }
 const raw=atob(encoded),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 status.textContent='VERIFYING BUILD · 82%';bar.style.width='82%';
 const actualCompressed=hex(await crypto.subtle.digest('SHA-256',bytes));
 if(actualCompressed!==compressedHash)throw new Error(`Compressed payload integrity mismatch. Expected ${compressedHash}, received ${actualCompressed}.`);
 status.textContent='DECOMPRESSING THE HOUSE · 91%';bar.style.width='91%';
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 const actualHtml=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));
 if(actualHtml!==htmlHash)throw new Error(`Decoded site integrity mismatch. Expected ${htmlHash}, received ${actualHtml}.`);
 status.textContent='OPENING THE HOUSE · 100%';bar.style.width='100%';
 document.open();document.write(html);document.close();
}catch(e){status.textContent='LOAD FAILURE';error.hidden=false;error.textContent=e.message+'\n\nReload once. If it persists, use the downloadable standalone build.';}
})();
</script></body></html>
